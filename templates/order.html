<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Order — {{svc.name}}</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',sans-serif;background:linear-gradient(180deg,#070b18,#0d1428);color:#e8ecf4;min-height:100vh;padding:20px}
.box{max-width:520px;margin:0 auto;background:rgba(15,23,42,.9);border:1px solid rgba(34,197,94,.2);border-radius:16px;padding:26px}
h2{color:#22c55e;text-align:center;margin-bottom:6px;font-size:22px}
.sub{text-align:center;color:#94a3b8;font-size:13px;margin-bottom:24px}
label{display:block;color:#cbd5e1;font-size:13px;font-weight:600;margin:16px 0 6px;letter-spacing:.5px}
input,select{width:100%;padding:13px;background:#0a1024;border:1px solid rgba(34,197,94,.3);border-radius:10px;color:#fff;font-size:15px;font-family:inherit}
.total{background:rgba(34,197,94,.1);border:1px solid rgba(34,197,94,.4);border-radius:10px;padding:16px;margin-top:20px;display:flex;justify-content:space-between;align-items:center}
.total .amt{color:#22c55e;font-size:24px;font-weight:800}
button{width:100%;padding:15px;background:linear-gradient(135deg,#22c55e,#16a34a);border:0;border-radius:10px;color:#fff;font-size:16px;font-weight:800;cursor:pointer;margin-top:24px}
.back{display:block;text-align:center;color:#64748b;text-decoration:none;margin-top:16px;font-size:13px}
</style></head><body>
<div class="box">
<h2>{{ svc.name }}</h2>
<div class="sub">{{ svc.cat }} · Rs {{ svc.price }} per 1000</div>
<form method="POST" action="/place_order">
<input type="hidden" name="service_id" value="{{svc.id}}">
<label>{{ label }}</label><input name="link" placeholder="https://..." required>
<label>Quantity (min 100)</label><input name="quantity" id="qty" type="number" value="1000" min="100" required oninput="calc()">
<label>Payment Method</label>
<select name="method"><option value="jazzcash">JazzCash — 03037678443</option><option value="easypaisa">Easypaisa — Maintenance pr</option><option value="binance">Binance — 902574695</option></select>
<div class="total"><span>Total Price</span><span class="amt">Rs <span id="total">0</span></span></div>
<button type="submit">Confirm Order</button>
</form>
<a href="/" class="back">← Back to Home</a>
</div>
<script>const PRICE={{svc.price}};function calc(){const q=parseInt(document.getElementById('qty').value)||0;document.getElementById('total').innerText=((PRICE/1000)*q).toFixed(2);}calc();</script>
</body></html>
