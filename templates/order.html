<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Order — {{svc.name}}</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',sans-serif;background:#0a0a2e;color:#e8ecf4;min-height:100vh;padding:20px}
.box{max-width:520px;margin:0 auto;background:#0f172a;border:1px solid rgba(34,197,94,.3);border-radius:18px;padding:26px}
h2{color:#22c55e;text-align:center;margin-bottom:6px;font-size:22px}
.sub{text-align:center;color:#94a3b8;font-size:13px;margin-bottom:24px}
label{display:block;color:#cbd5e1;font-size:13px;font-weight:600;margin:16px 0 6px}
input{width:100%;padding:13px;background:#0a1024;border:1px solid rgba(34,197,94,.3);border-radius:10px;color:#fff;font-size:15px;font-family:inherit;outline:none}
input:focus{border-color:#22c55e}
.total{background:rgba(34,197,94,.1);border:1px solid rgba(34,197,94,.4);border-radius:10px;padding:16px;margin-top:20px;display:flex;justify-content:space-between;align-items:center}
.total span:first-child{color:#94a3b8;font-size:14px}
.total .amt{color:#22c55e;font-size:24px;font-weight:800}
.btns{display:flex;gap:10px;margin-top:24px}
.btn{flex:1;padding:14px;border:0;border-radius:10px;color:#fff;font-size:15px;font-weight:800;cursor:pointer;text-align:center;text-decoration:none;font-family:inherit}
.btn-cancel{background:rgba(239,68,68,.15);border:1px solid #ef4444;color:#ef4444}
.btn-confirm{background:linear-gradient(135deg,#22c55e,#16a34a)}
.modal-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.85);z-index:9999;display:none;align-items:center;justify-content:center;padding:20px}
.modal-overlay.active{display:flex}
.modal{background:#0f172a;border:1px solid rgba(34,197,94,.4);border-radius:18px;padding:26px;max-width:420px;width:100%;text-align:center}
.modal .icon{width:80px;height:80px;border-radius:50%;background:linear-gradient(135deg,#22c55e,#16a34a);display:flex;align-items:center;justify-content:center;margin:0 auto 18px;font-size:44px;color:#fff}
.modal h3{color:#22c55e;font-size:20px;font-weight:800;margin-bottom:12px}
.modal p{color:#cbd5e1;font-size:14px;line-height:1.7;margin-bottom:10px}
.modal .wa{color:#facc15;font-weight:800;background:rgba(250,204,21,.15);padding:6px 14px;border-radius:8px;display:inline-block;margin:8px 0;font-size:15px}
.modal .oid{color:#22c55e;font-weight:800;font-size:14px;letter-spacing:1px;margin:8px 0}
.modal button{padding:12px 28px;background:linear-gradient(135deg,#22c55e,#16a34a);border:0;border-radius:10px;color:#fff;font-weight:800;cursor:pointer;font-size:14px;margin-top:14px;width:100%}
</style></head><body>
<div class="box">
<h2>{{ svc.name }}</h2>
<div class="sub">{{ svc.cat }} · Rs {{ svc.price }} per 1000</div>
<form method="POST" action="/place_order" id="orderForm">
<input type="hidden" name="service_id" value="{{svc.id}}">
<label>{{ label }}</label>
<input name="link" placeholder="https://..." required>
<label>Quantity (min 100)</label>
<input name="quantity" id="qty" type="number" value="1000" min="100" required oninput="calc()">
<div class="total"><span>Total Price</span><span class="amt">Rs <span id="total">0</span></span></div>
<div class="btns">
<a href="/" class="btn btn-cancel">Cancel</a>
<button type="submit" class="btn btn-confirm">Confirm Order</button>
</div>
</form>
</div>

<div class="modal-overlay" id="confirmModal">
<div class="modal">
<div class="icon">✓</div>
<h3>Order Confirmed!</h3>
<p class="oid" id="modalOid"></p>
<p>Aap ka order successfully submit ho gaya hai.</p>
<p style="margin-top:14px">Payment ke liye apna <b>username</b> aur <b>payment screenshot</b> WhatsApp karo:</p>
<p class="wa">03063871230</p>
<button onclick="window.location.href='/'">OK, Home</button>
</div>
</div>

<script>
var PRICE={{svc.price}};
function calc(){var q=parseInt(document.getElementById('qty').value)||0;document.getElementById('total').innerText=((PRICE/1000)*q).toFixed(2);}
calc();
document.getElementById('orderForm').addEventListener('submit',function(e){
  e.preventDefault();
  var form=this;
  var fd=new FormData(form);
  fetch('/place_order',{method:'POST',body:fd}).then(function(){
    document.getElementById('modalOid').innerText='Order placed successfully!';
    document.getElementById('confirmModal').classList.add('active');
  });
});
</script>
</body></html>
