<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Success</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',sans-serif;background:linear-gradient(180deg,#070b18,#0d1428);color:#e8ecf4;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.box{max-width:480px;width:100%;background:rgba(15,23,42,.9);border:1px solid rgba(34,197,94,.3);border-radius:20px;padding:40px 26px;text-align:center}
.tick{width:100px;height:100px;border-radius:50%;background:linear-gradient(135deg,#22c55e,#16a34a);display:flex;align-items:center;justify-content:center;margin:0 auto 24px;font-size:60px;color:#fff;box-shadow:0 0 40px rgba(34,197,94,.5)}
h2{color:#22c55e;font-size:24px;font-weight:800;margin-bottom:10px}
.oid{color:#94a3b8;font-size:14px;margin-bottom:8px}
.oid b{color:#22c55e;font-weight:800}
.msg{color:#e2e8f0;font-size:15px;line-height:1.7;margin:20px 0 30px}
button{width:100%;padding:15px;background:linear-gradient(135deg,#22c55e,#16a34a);border:0;border-radius:10px;color:#fff;font-size:16px;font-weight:800;cursor:pointer}
</style></head><body>
<div class="box">
<div class="tick">✓</div>
<h2>Order Successfully Submitted</h2>
<div class="oid">Order ID: <b>{{oid}}</b></div>
<p class="msg">Aap ka order successfully submit ho gaya hai. Admin jald hi verify kar ke deliver karega.</p>
<a href="/" style="text-decoration:none"><button>New Order</button></a>
</div></body></html>
