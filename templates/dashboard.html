<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',sans-serif;background:linear-gradient(180deg,#070b18,#0d1428);color:#e8ecf4;min-height:100vh;padding:20px}
.wrap{max-width:800px;margin:0 auto}
h2{color:#22c55e;margin-bottom:10px}
.links{margin-bottom:24px}
.links a{color:#22c55e;margin-right:16px;text-decoration:none;font-weight:600;font-size:14px}
table{width:100%;border-collapse:collapse;background:rgba(15,23,42,.9);border-radius:12px;overflow:hidden;margin-top:12px}
th,td{padding:12px;text-align:left;font-size:14px;border-bottom:1px solid rgba(255,255,255,.05)}
th{background:rgba(34,197,94,.15);color:#22c55e;font-weight:700;font-size:13px}
td{color:#cbd5e1}
.empty{text-align:center;color:#64748b;padding:30px;font-size:14px}
.st{display:inline-block;padding:3px 10px;border-radius:12px;font-size:12px;font-weight:700}
.st-Pending{background:rgba(250,204,21,.15);color:#facc15}
.st-Done{background:rgba(34,197,94,.15);color:#22c55e}
.st-Cancelled{background:rgba(239,68,68,.15);color:#ef4444}
.btn{display:inline-block;padding:10px 20px;background:linear-gradient(135deg,#22c55e,#16a34a);border-radius:8px;color:#fff;text-decoration:none;font-weight:700;font-size:14px;margin-top:16px}
</style></head><body>
<div class="wrap">
<h2>Dashboard</h2>
<div class="links"><a href="/">Home</a><a href="/logout">Logout</a></div>
<a href="/" class="btn">+ New Order</a>
<h3 style="color:#fff;margin-top:30px;font-size:16px">Mere Orders</h3>
{% if orders %}
<table><tr><th>Order ID</th><th>Service</th><th>Qty</th><th>Amount</th><th>Status</th></tr>
{% for o in orders %}<tr><td style="color:#22c55e;font-weight:700">{{o.id}}</td><td>{{o.service}}</td><td>{{o.qty}}</td><td>Rs {{o.charge}}</td><td><span class="st st-{{o.status|replace(' ','-')}}">{{o.status}}</span></td></tr>{% endfor %}
</table>
{% else %}<div class="empty">Abhi koi order nahi. Upar "New Order" pe click karo.</div>{% endif %}
</div></body></html>
