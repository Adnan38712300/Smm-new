<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Login — Adnan SMM</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',sans-serif;background:linear-gradient(180deg,#070b18,#0d1428);color:#e8ecf4;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.box{max-width:420px;width:100%;background:rgba(15,23,42,.95);border:1px solid rgba(34,197,94,.2);border-radius:18px;padding:32px 26px}
.bismillah{text-align:center;font-family:'Amiri',serif;font-size:26px;color:#4ade80;margin-bottom:20px}
.logo{width:60px;height:60px;border-radius:16px;background:linear-gradient(135deg,#2dd4bf,#22c55e);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:28px;color:#0a1024;margin:0 auto 16px}
h2{color:#fff;text-align:center;margin-bottom:6px;font-size:22px}
.sub{color:#94a3b8;text-align:center;font-size:13px;margin-bottom:26px}
label{display:block;color:#cbd5e1;font-size:13px;font-weight:600;margin:14px 0 6px}
input{width:100%;padding:13px;background:#0a1024;border:1px solid rgba(34,197,94,.3);border-radius:10px;color:#fff;font-size:15px;font-family:inherit}
input:focus{outline:none;border-color:#22c55e}
button{width:100%;padding:14px;background:linear-gradient(135deg,#22c55e,#16a34a);border:0;border-radius:10px;color:#fff;font-size:16px;font-weight:800;cursor:pointer;margin-top:22px}
.link{text-align:center;color:#94a3b8;font-size:13px;margin-top:18px}
.link a{color:#22c55e;text-decoration:none;font-weight:700}
.flash{background:rgba(239,68,68,.15);border:1px solid #ef4444;padding:10px;border-radius:8px;color:#ef4444;text-align:center;font-size:13px;margin-bottom:14px}
</style></head><body>
<div class="box">
<div class="bismillah">بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ</div>
<div class="logo">A</div>
<h2>Adnan SMM Panel</h2>
<div class="sub">Login karo aur services use karo</div>
{% with m = get_flashed_messages() %}{% if m %}{% for x in m %}<div class="flash">{{x}}</div>{% endfor %}{% endif %}{% endwith %}
<form method="POST">
<label>Email</label>
<input name="email" type="email" placeholder="apna@email.com" required>
<label>Password</label>
<input name="password" type="password" placeholder="Password" required>
<button type="submit">Login</button>
</form>
<div class="link">Naya account? <a href="/signup">Signup karo</a></div>
</div></body></html>
