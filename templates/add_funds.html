<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Add Funds</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',sans-serif;background:linear-gradient(180deg,#02020a,#0a0a2e,#0d0d28);color:#e8ecf4;min-height:100vh;padding:20px}
.box{max-width:500px;margin:0 auto;background:rgba(10,15,40,.9);backdrop-filter:blur(12px);border:1px solid rgba(34,197,94,.3);border-radius:18px;padding:26px;box-shadow:0 10px 40px rgba(0,0,0,.5)}
h2{color:#22c55e;text-align:center;font-size:22px;margin-bottom:6px}
.sub{color:#94a3b8;text-align:center;font-size:13px;margin-bottom:24px}
.step{display:flex;align-items:center;gap:10px;margin-bottom:14px;font-size:13px;color:#94a3b8}
.step-num{width:24px;height:24px;border-radius:50%;background:rgba(34,197,94,.15);border:1px solid #22c55e;color:#22c55e;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800}
label{display:block;color:#cbd5e1;font-size:13px;font-weight:600;margin:16px 0 8px}
.methods{display:grid;grid-template-columns:1fr;gap:10px}
.method{background:#0a1024;border:2px solid rgba(34,197,94,.2);border-radius:12px;padding:14px;cursor:pointer;display:flex;align-items:center;gap:12px;transition:all .2s}
.method:hover{border-color:#22c55e;background:rgba(34,197,94,.05)}
.method input{display:none}
.method.selected{border-color:#22c55e;background:rgba(34,197,94,.1);box-shadow:0 0 20px rgba(34,197,94,.2)}
.method-icon{width:40px;height:40px;border-radius:10px;background:linear-gradient(135deg,#22c55e,#16a34a);display:flex;align-items:center;justify-content:center;font-size:20px;color:#fff;flex-shrink:0}
.method-name{color:#fff;font-weight:700;font-size:14px}
.method-num{color:#94a3b8;font-size:11px}
input[type=number]{width:100%;padding:14px;background:#0a1024;border:1px solid rgba(34,197,94,.3);border-radius:10px;color:#fff;font-size:16px;font-family:inherit}
input[type=number]:focus{outline:none;border-color:#22c55e}
.hint{color:#64748b;font-size:11px;margin-top:6px}
.btns{display:flex;gap:10px;margin-top:24px}
.btn{flex:1;padding:14px;border:0;border-radius:10px;color:#fff;font-size:15px;font-weight:800;cursor:pointer;text-decoration:none;text-align:center;font-family:inherit}
.btn-next{background:linear-gradient(135deg,#22c55e,#16a34a)}
.btn-cancel{background:rgba(239,68,68,.15);border:1px solid #ef4444;color:#ef4444}
</style></head><body>
<div class="box">
<h2>💵 Add Funds</h2>
<div class="sub">Step 1: Payment method aur amount select karo</div>
<form method="POST" action="/add_funds/next" id="form">
<label>1️⃣ Payment Method Choose Karo</label>
<div class="methods">
{% for key, m in methods.items() %}
<div class="method" onclick="selectMethod(this, '{{ key }}')">
<input type="radio" name="method" value="{{ key }}" required>
<div class="method-icon">{% if key=='jazzcash' %}📱{% elif key=='easypaisa' %}💚{% elif key=='binance' %}₿{% else %}💳{% endif %}</div>
<div>
<div class="method-name">{{ m.name }}</div>
<div class="method-num">{{ m.number }}</div>
</div>
</div>
{% endfor %}
</div>

<label>2️⃣ Amount (Min Rs 10 — Max Rs 10,000)</label>
<input type="number" name="amount" min="10" max="10000" placeholder="1000" required>
<div class="hint">Amount Rs 10 se Rs 10,000 ke darmiyan honi chahiye</div>

<div class="btns">
<a href="/" class="btn btn-cancel">Cancel</a>
<button type="submit" class="btn btn-next">Next →</button>
</div>
</form>
</div>
<script>
function selectMethod(el, key){
    document.querySelectorAll('.method').forEach(m=>m.classList.remove('selected'));
    el.classList.add('selected');
    el.querySelector('input').checked = true;
}
</script>
</body></html>
