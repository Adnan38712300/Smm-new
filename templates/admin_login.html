<!DOCTYPE html><html><head><meta charset="utf-8"><title>Admin Login</title>
<style>body{background:#0a0a0f;color:#e0e0e0;font-family:Arial;text-align:center;padding:60px}
input{display:block;margin:12px auto;padding:12px;width:280px;border-radius:8px;border:1px solid #00ff99;background:#1a1a2e;color:#fff}
button{padding:12px 30px;background:#00ff99;border:0;border-radius:8px;font-weight:bold;cursor:pointer}</style></head><body>
<h2 style="color:#00ff99">Admin Login</h2>
<form method="POST">
<input name="username" placeholder="Username" required>
<input name="password" type="password" placeholder="Password" required>
<button>Login</button>
</form></body></html>
